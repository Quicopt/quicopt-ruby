# SPDX-License-Identifier: Apache-2.0
# Publish the `quicopt` gem to RubyGems via Trusted Publishing (OIDC) — no
# long-lived API token, and it sidesteps the MFA-vs-CI problem.
#
# Set the trusted publisher up once on rubygems.org (gem → Trusted Publishers)
# with this repository, the workflow filename `release.yml`, and the environment
# `rubygems` below. For a gem that does not exist yet, register it as a *pending*
# trusted publisher; the first successful run then creates the gem.
#
# Release flow: bump lib/quicopt/version.rb, land it on main, then publish a
# GitHub Release whose tag is `v<version>` on that commit:
#
#   gh release create v0.4.1 --target main --title "quicopt 0.4.1" --notes-file notes.md
#
# The `check` job refuses a tag that does not name the version in version.rb;
# the tests then run on every supported Ruby. The `publish` job runs in the
# `rubygems` environment, which requires a maintainer's approval in the Actions
# tab before anything is pushed. A published version can never be re-pushed
# (`gem yank` does not free the number), so the approval is the last chance to
# stop it.
#
# `rubygems/release-gem` runs `bundle exec rake release`. Bundler's release task
# tags the version only when the tag does not exist yet; here it always exists,
# since the Release created it, so the task prints "Tag v… has already been
# created", skips the git push and goes on to push the gem. The job gets no
# write access to the repository, so it could not push a tag even if it tried.
name: Publish to RubyGems

on:
  release:
    types: [published]

jobs:
  check:
    name: Check the tag against the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: The release tag names the version in lib/quicopt/version.rb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(ruby -e 'require "./lib/quicopt/version"; print Quicopt::VERSION')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match version $version in lib/quicopt/version.rb (expected v$version)"
            exit 1
          fi

  test:
    name: Test on Ruby ${{ matrix.ruby }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.3", "3.4"]   # the floor declared in the gemspec, upwards
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

  publish:
    name: Publish to RubyGems
    needs: test
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write    # the OIDC token RubyGems Trusted Publishing verifies — no secrets
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
